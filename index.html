  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

flex;gap:5px;margin-top:16px\"><\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <div data-rv=\"\" style=\"margin-top:18px;font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:0.07em;color:#D1707F\">EACH DOT IS ONE SIGNING NODE. FILLED = INSIDE THE SET A CONTRACT WOULD USE. HOLLOW = RANKED OUT BY DISTANCE FROM THE MEDIAN.<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"pop-method\" style=\"background:#FFE3E3;color:#290004;padding:clamp(64px,8vw,110px) clamp(20px,4vw,56px);scroll-snap-align:start;scroll-margin-top:76px;position:relative;z-index:2\">\n  <div style=\"max-width:1320px;margin:0 auto\">\n    <div data-rv=\"\" style=\"font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:0.14em;color:#AE0822;margin-bottom:16px\">03 — THE METHOD<\u002Fdiv>\n    <h2 data-rv=\"\" style=\"margin:0 0 18px;font-size:clamp(34px,4.4vw,60px);line-height:1.0;letter-spacing:-0.032em;font-weight:700;color:#AE0822\">Four steps, no server<\u002Fh2>\n    <p data-rv=\"\" style=\"margin:0 0 52px;max-width:600px;font-size:16.5px;line-height:1.6;color:#7A2130;text-wrap:pretty\">Everything above happens in the tab you have open. The registry ships inside the RedStone SDK, and signature recovery runs client side.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:24px\">\n\n      <div data-rv=\"\" style=\"border:1px solid #D9808F;background:#FFF6F4;padding:34px 32px;display:flex;flex-direction:column;gap:24px\" style-hover=\"border-color:#AE0822\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:24px\">\n          <div>\n            <h3 style=\"margin:0 0 12px;font-size:27px;font-weight:700;letter-spacing:-0.02em;color:#AE0822\">Data sourcing<\u002Fh3>\n            <p style=\"margin:0;max-width:330px;font-size:15px;line-height:1.55;color:#5C1420;text-wrap:pretty\">One request covers every feed on screen. The gateway has no per‑feed route — it returns all 868 feeds whatever you ask for, so the page asks once instead of once per symbol.<\u002Fp>\n          <\u002Fdiv>\n          <svg width=\"104\" height=\"80\" sc-camel-view-box=\"0 0 120 92\" fill=\"none\" stroke=\"#E41939\" stroke-width=\"2\" stroke-linejoin=\"round\" style=\"flex:0 0 auto\"><path d=\"M4 18 L18 4 L116 4 L116 74 L102 88 L4 88 Z\"><\u002Fpath><path d=\"M4 18 L102 18 L102 88\"><\u002Fpath><path d=\"M102 18 L116 4\"><\u002Fpath><path d=\"M4 32 L102 32\"><\u002Fpath><circle cx=\"93\" cy=\"25\" r=\"2.6\"><\u002Fcircle><path d=\"M80 22 L80 28 M77.4 23.5 L82.6 26.5 M82.6 23.5 L77.4 26.5\"><\u002Fpath><path d=\"M38 46 L38 74 M53 40 L53 74 M68 54 L68 74\" stroke=\"#AE0822\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"font-family:'Roboto Mono',monospace;font-size:96px;line-height:0.8;font-weight:700;color:#AE0822;margin-top:auto\">1<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-rv=\"\" style=\"border:1px solid #D9808F;background:#FFF6F4;padding:34px 32px;display:flex;flex-direction:column;gap:24px\" style-hover=\"border-color:#AE0822\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:24px\">\n          <div>\n            <h3 style=\"margin:0 0 12px;font-size:27px;font-weight:700;letter-spacing:-0.02em;color:#AE0822\">Signature recovery<\u002Fh3>\n            <p style=\"margin:0;max-width:330px;font-size:15px;line-height:1.55;color:#5C1420;text-wrap:pretty\">Each package carries an ECDSA signature. The address that produced it is recovered in your browser and compared against RedStone's node registry — no trust in the gateway's own label.<\u002Fp>\n          <\u002Fdiv>\n          <svg width=\"104\" height=\"80\" sc-camel-view-box=\"0 0 120 92\" fill=\"none\" stroke=\"#E41939\" stroke-width=\"2\" stroke-linejoin=\"round\" style=\"flex:0 0 auto\"><path d=\"M4 18 L18 4 L116 4 L116 74 L102 88 L4 88 Z\"><\u002Fpath><path d=\"M4 18 L102 18 L102 88\"><\u002Fpath><path d=\"M102 18 L116 4\"><\u002Fpath><path d=\"M4 32 L102 32\"><\u002Fpath><circle cx=\"93\" cy=\"25\" r=\"2.6\"><\u002Fcircle><path d=\"M80 22 L80 28 M77.4 23.5 L82.6 26.5 M82.6 23.5 L77.4 26.5\"><\u002Fpath><path d=\"M53 44 L67 54 L53 64 L39 54 Z\" stroke=\"#AE0822\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"font-family:'Roboto Mono',monospace;font-size:96px;line-height:0.8;font-weight:700;color:transparent;-webkit-text-stroke:2px #E8A8B2;margin-top:auto\">2<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-rv=\"\" style=\"border:1px solid #D9808F;background:#FFF6F4;padding:34px 32px;display:flex;flex-direction:column;gap:24px\" style-hover=\"border-color:#AE0822\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:24px\">\n          <div>\n            <h3 style=\"margin:0 0 12px;font-size:27px;font-weight:700;letter-spacing:-0.02em;color:#AE0822\">Median ranking<\u002Fh3>\n            <p style=\"margin:0;max-width:330px;font-size:15px;line-height:1.55;color:#5C1420;text-wrap:pretty\">The SDK normally sorts packages by distance from the median and hands a contract only the closest N. Which ones get dropped is the interesting part, so the ranking is reproduced and displayed instead of applied.<\u002Fp>\n          <\u002Fdiv>\n          <svg width=\"104\" height=\"80\" sc-camel-view-box=\"0 0 120 92\" fill=\"none\" stroke=\"#E41939\" stroke-width=\"2\" stroke-linejoin=\"round\" style=\"flex:0 0 auto\"><path d=\"M4 18 L18 4 L116 4 L116 74 L102 88 L4 88 Z\"><\u002Fpath><path d=\"M4 18 L102 18 L102 88\"><\u002Fpath><path d=\"M102 18 L116 4\"><\u002Fpath><path d=\"M4 32 L102 32\"><\u002Fpath><circle cx=\"93\" cy=\"25\" r=\"2.6\"><\u002Fcircle><path d=\"M80 22 L80 28 M77.4 23.5 L82.6 26.5 M82.6 23.5 L77.4 26.5\"><\u002Fpath><path d=\"M26 60 L44 48 L62 64 L80 42\" stroke=\"#AE0822\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"font-family:'Roboto Mono',monospace;font-size:96px;line-height:0.8;font-weight:700;color:transparent;-webkit-text-stroke:2px #E8A8B2;margin-top:auto\">3<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-rv=\"\" style=\"border:1px solid #D9808F;background:#FFF6F4;padding:34px 32px;display:flex;flex-direction:column;gap:24px\" style-hover=\"border-color:#AE0822\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:24px\">\n          <div>\n            <h3 style=\"margin:0 0 12px;font-size:27px;font-weight:700;letter-spacing:-0.02em;color:#AE0822\">Payload export<\u002Fh3>\n            <p style=\"margin:0;max-width:330px;font-size:15px;line-height:1.55;color:#5C1420;text-wrap:pretty\">The chosen packages, packed into the exact bytes a consumer contract would receive. Handing that over is the difference between saying the evidence exists and letting someone walk away with it.<\u002Fp>\n          <\u002Fdiv>\n          <svg width=\"104\" height=\"80\" sc-camel-view-box=\"0 0 120 92\" fill=\"none\" stroke=\"#E41939\" stroke-width=\"2\" stroke-linejoin=\"round\" style=\"flex:0 0 auto\"><path d=\"M4 18 L18 4 L116 4 L116 74 L102 88 L4 88 Z\"><\u002Fpath><path d=\"M4 18 L102 18 L102 88\"><\u002Fpath><path d=\"M102 18 L116 4\"><\u002Fpath><path d=\"M4 32 L102 32\"><\u002Fpath><circle cx=\"93\" cy=\"25\" r=\"2.6\"><\u002Fcircle><path d=\"M80 22 L80 28 M77.4 23.5 L82.6 26.5 M82.6 23.5 L77.4 26.5\"><\u002Fpath><path d=\"M24 46 L78 46 M24 56 L64 56 M24 66 L70 66\" stroke=\"#AE0822\" stroke-dasharray=\"3 4\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"font-family:'Roboto Mono',monospace;font-size:96px;line-height:0.8;font-weight:700;color:transparent;-webkit-text-stroke:2px #E8A8B2;margin-top:auto\">4<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"pop-stack\" style=\"padding:clamp(64px,8vw,110px) clamp(20px,4vw,56px);scroll-snap-align:start;scroll-margin-top:76px\">\n  <div style=\"max-width:1320px;margin:0 auto\">\n    <div data-rv=\"\" style=\"font-family:'Roboto Mono',m \nconst RED = '#E41939', DIM = '#D1707F', SHELL = '#FFE3E3';\nconst POLL_MS = 15000;\nconst REGISTRY = 'https://raw.githubusercontent.com/redstone-finance/redstone-oracles-monorepo/main/packages/sdk/src/registry/initial-state.json';\nconst HOSTS = [\n  ['oracle-gateway-1.a.redstone.vip', 'https://oracle-gateway-1.a.redstone.vip/', 'Data packages · signatures'],\n  ['oracle-gateway-1.a.redstone.finance', 'https://oracle-gateway-1.a.redstone.finance/', 'Data packages · signatures'],\n  ['oracle-gateway-2.a.redstone.finance', 'https://oracle-gateway-2.a.redstone.finance/', 'Data packages · historical route'],\n  ['o40uhl5zq9.execute-api.us-east-1.amazonaws.com', 'https://o40uhl5zq9.execute-api.us-east-1.amazonaws.com/prices/pull/many-historical?symbols=ETH', 'Seven days of hourly prices · unsigned'],\n  ['raw.githubusercontent.com', REGISTRY, 'Node registry · the names beside each signer'],\n  ['cdn.jsdelivr.net', 'https://cdn.jsdelivr.net/gh/redstone-finance/redstone-images@main/symbols/eth.svg', 'Symbol icons'],\n  ['api.coingecko.com', 'https://api.coingecko.com/api/v3/simple/price?ids=redstone-oracles&vs_currencies=usd', '$RED market price · not an oracle feed']\n];\n\nfunction fmt(v){\n  if(!Number.isFinite(v)) return '—';\n  const a = Math.abs(v);\n  const d = a >= 1000 ? 2 : a >= 1 ? 4 : a >= 0.01 ? 6 : a > 0 ? 8 : 2;\n  return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});\n}\nfunction median(xs){const s=[...xs].sort((a,b)=>a-b);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}\n\n/* symbol icons, straight from the repo RedStone publishes them in */\nfunction logoBase(id){ return String(id).split(/[\\/_-]/)[0].toLowerCase(); }\nfunction mountLogo(host, id, px){\n  if(!host) return;\n  host.textContent = '';\n  host.style.border = '0';\n  const base = logoBase(id);\n  const img = document.createElement('img');\n  img.alt = '';\n  img.width = px; img.height = px;\n  img.style.cssText = 'width:' + px + 'px;height:' + px + 'px;display:block;object-fit:contain;border-radius:50%;background:#3A050C';\n  let i = 0;\n  img.onerror = () => {\n    i++;\n    if(i < EXT.length){ img.src = LOGO + base + '.' + EXT[i]; return; }\n    img.remove();\n    const fb = document.createElement('span');\n    fb.textContent = base.slice(0,2).toUpperCase();\n    fb.style.cssText = 'width:' + px + 'px;height:' + px + 'px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#3A050C;color:#D1707F;font-family:\\'Roboto Mono\\',monospace;font-size:' + Math.round(px*0.38) + 'px';\n    host.appendChild(fb);\n  };\n  img.src = LOGO + base + '.' + EXT[0];\n  host.appendChild(img);\n}\n\n/* odometer-style digit roll */\nconst CELL_CSS = 'display:inline-block;height:1em;line-height:1em;overflow:hidden;vertical-align:top';\nconst LINE_CSS = 'display:block;height:1em;line-height:1em';\nfunction makeCell(ch){\n  const cell = document.createElement('span');\n  cell.style.cssText = CELL_CSS;\n  const stack = document.createElement('span');\n  stack.style.cssText = 'display:block;will-change:transform';\n  const line = document.createElement('span');\n  line.style.cssText = LINE_CSS;\n  line.textContent = ch;\n  stack.appendChild(line);\n  stack.dataset.v = ch;\n  cell.appendChild(stack);\n  return cell;\n}\nfunction rollCell(cell, ch, up){\n  const stack = cell.firstChild;\n  if(stack.dataset.v === ch) return;\n  const old = stack.dataset.v;\n  stack.dataset.v = ch;\n  if(!/[0-9]/.test(ch) || !/[0-9]/.test(old)){\n    stack.innerHTML = '<span style=\"' + LINE_CSS + '\">' + ch + '<\u002Fspan>';\n    return;\n  }\n  stack.style.transition = 'none';\n  stack.innerHTML = up\n    ? '<span aria-hidden=\"true\" style=\"' + LINE_CSS + '\">' + old + '<\u002Fspan><span style=\"' + LINE_CSS + '\">' + ch + '<\u002Fspan>'\n    : '<span style=\"' + LINE_CSS + '\">' + ch + '<\u002Fspan><span aria-hidden=\"true\" style=\"' + LINE_CSS + '\">' + old + '<\u002Fspan>';\n  stack.style.transform = up ? 'translateY(0)' : 'translateY(-1em)';\n  void stack.offsetHeight;\n  stack.style.transition = 'transform .55s cubic-bezier(.22,.85,.25,1)';\n  stack.style.transform = up ? 'translateY(-1em)' : 'translateY(0)';\n  clearTimeout(stack._settle);\n  stack._settle = setTimeout(() => {\n    if(stack.dataset.v !== ch) return;\n    stack.style.transition = 'none';\n    stack.style.transform = 'translateY(0)';\n    stack.innerHTML = '<span style=\"' + LINE_CSS + '\">' + ch + '<\u002Fspan>';\n  }, 620);\n}\nfunction rollText(el, text, up){\n  const chars = [...text];\n  if(!el._cells || el._cells.length !== chars.length){\n    el.textContent = '';\n    el._cells = chars.map(c => { const cell = makeCell(c); el.appendChild(cell); return cell; });\n    return;\n  }\n  chars.forEach((c, i) => rollCell(el._cells[i], c, up));\n}\n\nclass Component extends DCLogic {\n  componentDidMount(){\n    this.alive = true;\n    this.hist = {};\n    this.live = {};\n    this.selected = 'ETH';\n    this.sessions = {};\n    const wait = () => {\n      if(!this.alive) return;\n      if(document.getElementById('pop-end') && document.getElementById('pop-gem')) this.boot();\n      else setTimeout(wait, 120);\n    };\n    wait();\n  }\n  componentWillUnmount(){\n    this.alive = false;\n    clearInterval(this.pollT); clearInterval(this.sparkT); clearInterval(this.armT);\n    cancelAnimationFrame(this.raf); cancelAnimationFrame(this.gemRaf); cancelAnimationFrame(this.progRaf);\n    window.removeEventListener('resize', this.onResize);\n    if(this.renderer) this.renderer.dispose();\n  }\n\n  boot(){\n    if(this.booted) return; this.booted = true;\n    this.reveal();\n    this.progress();\n    this.grid();\n    this.chart3d();\n    this.marquee();\n    this.search();\n    this.cardClicks();\n    FEEDS.forEach(sym => mountLogo(document.querySelector('[data-feed=\"' + sym + '\"] [data-logo]'), sym, 26));\n    mountLogo(document.getElementById('pop-sel-logo'), 'ETH', 34);\n    this.onResize = () => { this.sizeGrid(); is.catalogue || [];\n      const hits = (q ? cat.filter(f => f.id.toUpperCase().indexOf(q) >= 0)\n                          .sort((a,b) => a.id.toUpperCase().indexOf(q) - b.id.toUpperCase().indexOf(q))\n                      : cat).slice(0, 40);\n      list.textContent = '';\n      if(!hits.length){\n        const d = document.createElement('div');\n        d.style.cssText = \"padding:18px 22px;font-family:'Roboto Mono',monospace;font-size:12px;color:#D1707F\";\n        d.textContent = cat.length ? 'NO FEED MATCHES “' + input.value + '”' : 'CATALOGUE LOADING…';\n        list.appendChild(d);\n      }\n      hits.forEach(f => {\n        const on = f.id === this.selected;\n        const row = document.createElement('button');\n        row.type = 'button';\n        row.style.cssText = \"display:flex;width:100%;align-items:center;gap:14px;padding:11px 22px;background:\" + (on?'#3A050C':'transparent') + \";border:0;border-bottom:1px solid #3A060D;cursor:pointer;text-align:left;font-family:'Roboto Mono',monospace\";\n        const logo = document.createElement('span');\n        logo.style.cssText = 'width:22px;height:22px;flex:0 0 auto;display:block';\n        row.appendChild(logo);\n        mountLogo(logo, f.id, 22);\n        const name = document.createElement('span');\n        name.style.cssText = 'font-size:13px;color:' + (on?'#E41939':'#FFE3E3') + ';overflow:hidden;text-overflow:ellipsis;white-space:nowrap';\n        name.textContent = f.id;\n        row.appendChild(name);\n        if(f.external){\n          const tag = document.createElement('span');\n          tag.style.cssText = 'font-size:9.5px;letter-spacing:0.1em;color:#D1707F;border:1px solid #6B0F1E;padding:3px 7px;white-space:nowrap';\n          tag.textContent = 'MARKET DATA · UNSIGNED';\n          row.appendChild(tag);\n        }\n        const val = document.createElement('span');\n        val.style.cssText = 'margin-left:auto;font-size:12px;color:#D1707F;font-variant-numeric:tabular-nums;white-space:nowrap';\n        val.textContent = fmt(f.value);\n        row.appendChild(val);\n        row.addEventListener('mouseenter', () => { if(f.id !== this.selected) row.style.background = '#2E0308'; });\n        row.addEventListener('mouseleave', () => { if(f.id !== this.selected) row.style.background = 'transparent'; });\n        row.addEventListener('mousedown', (e) => {\n          e.preventDefault();\n          this.select(f.id);\n          input.value = ''; input.blur(); close();\n        });\n        list.appendChild(row);\n      });\n      list.style.display = 'block';\n    };\n    input.addEventListener('focus', render);\n    input.addEventListener('input', render);\n    input.addEventListener('blur', () => setTimeout(close, 130));\n    input.addEventListener('keydown', (e) => {\n      if(e.key === 'Escape'){ input.value = ''; input.blur(); close(); }\n      if(e.key === 'Enter'){\n        const q = input.value.trim().toUpperCase();\n        const cat = this.catalogue || [];\n        const hit = cat.find(f => f.id.toUpperCase() === q) || cat.find(f => f.id.toUpperCase().indexOf(q) >= 0);\n        if(hit){ this.select(hit.id); input.value = ''; input.blur(); close(); }\n      }\n    });\n  }\n  nameFor(addr){\n    const n = this.nodeNames && this.nodeNames[String(addr).toLowerCase()];\n    return n ? n + ' \\u2713' : 'not in registry';\n  }\n  signedCount(){\n    return (this.catalogue || []).filter(f => !f.external).length;\n  }\n  refreshCount(){\n    const el = document.getElementById('pop-search-count');\n    if(el) el.textContent = this.signedCount() + ' SIGNED FEEDS';\n  }\n  paintSigners(){\n    const sym = this.selected;\n    const d = this.packRows(sym);\n    const rowsEl = document.getElementById('pop-sigrows');\n    const idEl = document.getElementById('pop-sel-id');\n    if(idEl) idEl.textContent = sym;\n    if(!rowsEl) return;\n    const sub = document.getElementById('pop-sel-sub');\n    const pRed = document.getElementById('pop-sel-price');\n    const sRed = document.getElementById('pop-sel-spread');\n    if(!d && sym === 'RED'){\n      if(sub) sub.textContent = 'coingecko · market price';\n      if(pRed) rollText(pRed, Number.isFinite(this.redPrice) ? '$' + this.redPrice.toFixed(4) : '—', true);\n      if(sRed) sRed.textContent = 'no signed packages';\n      rowsEl.innerHTML = '<div style=\"padding:26px clamp(16px,2vw,26px);font-size:14px;line-height:1.6;color:#EBB3B9\">RedStone does not publish a RED feed on <span style=\"font-family:\\'Roboto Mono\\',monospace;font-size:12.5px;color:#D1707F\">redstone&#8209;primary&#8209;prod<\u002Fspan>, so there are no signatures to check here. The line to the left is ordinary market data, and the token trades like any other — it just is not something this oracle signs.<\u002Fdiv>';\n      return;\n    }\n    if(!d){\n      rowsEl.textContent = '';\n      if(sub) sub.textContent = 'awaiting package…';\n      return;\n    }\n    if(sub) sub.textContent = 'redstone\\u2011primary\\u2011prod · ' + new Date(d.ts).toISOString().slice(11,19) + ' UTC';\n    const pEl = document.getElementById('pop-sel-price');\n    if(pEl) rollText(pEl, fmt(d.med), true);\n    const sEl = document.getElementById('pop-sel-spread');\n    if(sEl) sEl.textContent = d.rows.length + ' signers · spread ' + d.spreadBps.toFixed(2) + ' bps';\n    rowsEl.textContent = '';\n    d.rows.forEach((row, i) => {\n      const on = i < 3;\n      const el = document.createElement('div');\n      el.style.cssText = 'display:grid;grid-template-columns:26px 1fr 1fr 74px;gap:12px;align-items:center;padding:14px clamp(16px,2vw,26px);border-bottom:1px solid #3A060D;font-family:\\'Roboto Mono\\',monospace;font-size:12px;opacity:0;transform:translateX(-10px);transition:opacity .5s ease,transform .5s ease';\n      el.innerHTML =\n        '<span style=\"color:' + (on?RED:'#D1707F') + '\">' + (i+1) + '<\u002Fspan>' +\n        '<span style=\"min-width:0\"><span style=\"display:block;color:' + (on?SHELL:'#D1707F') + ';font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">' + this.nameFor(row.addr) + '<\u002Fspan>' +\n          '<span style=\"display:block;color:#D1707F;font-size:10px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">' + (row.addr ? row.addr.slice(0,8) + '\\u2026' + row.addr.slice(-6) : 'unknown') + '<\u002Fspan><\u002Fspan>' +\n        '<span style=\"color:' + (on?SHELL:'#D1707F') + ';text-align:right;font-variant-numeric:tabular-nums\">' + fmt(row.value) + '<\u002Fspan>' +\n        '<span style=\"color:' + (on?'#EBB3B9':'#D1707F') + ';text-align:right\">' + (row.dist*10000).toFixed(1) + 'bps<\u002Fspan>';\n      rowsEl.appendChild(el);\n      setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'none'; }, 55*i);\n    });\n  }\n\n  /* ---------- live poll: automatic, every 15s ---------- */\n  async poll(){\n    let body = null;\n    try {\n      const r = await fetch(GW, {headers:{accept:'application/json'}});\n      if(!r.ok) throw new Error(r.status);\n      body = await r.json();\n    } catch(e){\n      const s = document.getElementById('pop-status');\n      if(s) s.textContent = 'REDSTONE\\u2011PRIMARY\\u2011PROD · GATEWAY UNREACHABLE';\n      this.nextAt = Date.now() + POLL_MS;\n      return;\n    }\n    if(!this.alive) return;\n    this.nextAt = Date.now() + POLL_MS;\n    this.raw = body;\n    this.catalogue = Object.entries(body)\n      .filter(([, p]) => Array.isArray(p) && p.length && p[0].dataPoints && p[0].dataPoints.length === 1)\n      .map(([id, p]) => ({id, value:Number(p[0].dataPoints[0].value)}))\n      .sort((a,b) => a.id.localeCompare(b.id));\n    if(Number.isFinite(this.redPrice)) this.catalogue.push({id:'RED', value:this.redPrice, external:true});\n    this.catalogue.sort((a,b) => a.id.localeCompare(b.id));\n    this.refreshCount();\n\n    const prev = this.live;\n    const out = {};\n    for(const sym of FEEDS){\n      const d = this.packRows(sym);\n      if(d) out[sym] = d;\n    }\n    this.live = out;\n    this.paint(prev);\n    this.paintSigners();\n\n    const track = FEEDS.concat(this.selected);\n    for(const sym of track){\n      const d = out[sym] || this.packRows(sym);\n      if(!d) continue;\n      if(!this.sessions[sym]) this.sessions[sym] = [];\n      this.sessions[sym].push(d.med);\n      if(this.sessions[sym].length > 90) this.sessions[sym].shift();\n    }\n    this.build3d();\n    this.headFlash = 1;\n  }\n\n  paint(prev){\n    const st = document.getElementById('pop-status');\n    if(st) st.textContent = 'REDSTONE\\u2011PRIMARY\\u2011PROD · ' + this.signedCount() + ' FEEDS LIVE';\n\n    for(const sym of FEEDS){\n      const d = this.live[sym]; if(!d) continue;\n      const before = prev[sym] && prev[sym].med;\n      const dir = before ? (d.med > before ? 1 : d.med < before ? -1 : 0) : 0;\n      const col = dir > 0 ? '#FFCFC5' : dir < 0 ? '#E41939' : SHELL;\n\n      const card = document.querySelector('[data-feed=\"' + sym + '\"]');\n      if(card){\n        const p = card.querySelector('[data-price]');\n        if(p){ rollText(p, fmt(d.med), dir >= 0); p.style.color = col; setTimeout(() => { p.style.color = SHELL; }, 750); }\n        const sp = card.querySelector('[data-spread]');\n        if(sp) sp.textContent = 'spread ' + d.spreadBps.toFixed(2) + ' bps';\n        const dots = card.querySelector('[data-dots]');\n        if(dots){\n          dots.textContent = '';\n          d.rows.forEach((row, i) => {\n            const on = i < 3;\n            const el = document.createElement('span');\n            el.title = row.addr + ' — ' + fmt(row.value);\n            el.style.cssText = 'width:9px;height:9px;display:block;transform:rotate(45deg);border:1px solid ' + (on?RED:'#6B0F1E') + ';background:' + (on?RED:'transparent');\n            dots.appendChild(el);\n          });\n        }\n      }\n      const h = this.hist[sym];\n      const pct7 = (h && h.length > 1) ? ((h[h.length-1].v - h[0].v)/h[0].v)*100 : null;\n      document.querySelectorAll('[data-mq=\"' + sym + '\"]').forEach(el => {\n        const pe = el.querySelector('[data-mqp]');\n        if(pe){ pe.textContent = fmt(d.med); pe.style.color = col; setTimeout(() => { pe.style.color = '#D1707F'; }, 750); }\n        const de = el.querySelector('[data-mqd]');\n        if(de && pct7 !== null){\n          de.textContent = (pct7>=0?'+':'') + pct7.toFixed(2) + '%';\n          de.style.color = pct7 >= 0 ? '#FFCFC5' : '#D1707F';\n        }\n      });\n    }\n\n    const eth = this.live.ETH;\n    if(eth){\n      const hp = document.getElementById('pop-hero-price');\n      if(hp){\n        const before = prev.ETH && prev.ETH.med;\n        rollText(hp, fmt(eth.med), !before || eth.med >= before);\n        hp.style.transition = 'color .4s ease';\n        hp.style.color = before ? (eth.med > before ? '#FFCFC5' : eth.med < before ? '#E41939' : SHELL) : SHELL;\n        setTimeout(() => { hp.style.color = SHELL; }, 850);\n      }\n      const hs = document.getElementById('pop-hero-spread');\n      if(hs) hs.textContent = eth.spreadBps.toFixed(2) + ' bps';\n      const age = document.getElementById('pop-age');\n      if(age) age.textContent = 'PACKAGE SIGNED ' + new Date(eth.ts).toISOString().slice(11,19) + ' UTC · ' + eth.rows.length + ' NODES · REFRESHES ITSELF';\n    }\n  }\n\n  renderVals(){ return {}; }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
